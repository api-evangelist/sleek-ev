aid: sleek-ev
name: Sleek EV
description: 'Sleek EV (SLEEK EV) is a Thai-Singaporean electric motorcycle company founded in 2022,
  headquartered in Singapore with primary operations in Thailand. Under the mission "Sustainability must
  be affordable," it builds accessible electric two-wheelers — the TYPE-S, TYPE-E and TYPE-X motorcycles
  and the SLEEK Play 1.0 urban scooter — powered by its S-DRIVE powertrain and IP67-rated lithium-ion
  batteries (via Ampace/CATL). It runs the S-Charge fast-charging network (100+ stations across Bangkok)
  and a SLEEK App for vehicle monitoring, route planning and station finding, sold through a nationwide
  dealer network. BOI-certified and backed by ORZON Ventures (OR + 500 TukTuks), January Capital, A2D
  Ventures and Krungsri Finnovate. This is a consumer product company with no public developer/API surface.'
